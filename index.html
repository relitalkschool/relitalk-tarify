<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RELITALK — Выберите свой тариф</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF9F6;
    --ink:#0F0E19;
    --purple:#775EF3;
    --purple-dark:#5F46E0;
    --purple-soft:#EDEAFB;
    --green:#5BB482;
    --muted:#8A8794;
    --line:#E9E6DE;
    --card:#FFFFFF;
    --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Manrope',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.4;
    padding:56px 24px 40px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1160px;margin:0 auto}
  .eyebrow{
    text-align:center;
    color:var(--purple);
    font-weight:800;
    letter-spacing:.18em;
    font-size:15px;
    margin-bottom:26px;
  }
  h1{
    text-align:center;
    font-weight:800;
    font-size:clamp(34px,6vw,64px);
    line-height:1.04;
    letter-spacing:-.02em;
    margin-bottom:20px;
  }
  h1 .accent{color:var(--purple)}
  .sub{
    text-align:center;
    color:var(--muted);
    font-size:clamp(15px,2vw,19px);
    font-weight:500;
    margin-bottom:30px;
  }
  /* promo */
  .promo{
    display:flex;gap:14px;justify-content:center;align-items:stretch;
    flex-wrap:wrap;margin-bottom:14px;
  }
  .promo input{
    font-family:inherit;font-size:17px;font-weight:600;letter-spacing:.02em;
    padding:15px 22px;width:min(320px,80vw);
    border:1.5px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);
    outline:none;transition:border-color .15s, box-shadow .15s;
  }
  .promo input::placeholder{color:#C7C3BA;letter-spacing:.25em}
  .promo-field{position:relative;display:inline-flex}
  .promo-field input{padding-right:52px;letter-spacing:.3em}
  .eye{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    background:none;border:none;border-radius:12px;cursor:pointer;color:#B4B0A6;
    transition:color .15s, background .15s;padding:0;
  }
  .eye:hover{color:var(--purple);background:var(--purple-soft)}
  .eye:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
  .eye.on{color:var(--purple)}
  .promo input:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(119,94,243,.14)}
  .promo button{
    font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;
    padding:15px 34px;border:none;border-radius:16px;
    background:var(--purple);color:#fff;transition:background .15s, transform .05s;
  }
  .promo button:hover{background:var(--purple-dark)}
  .promo button:active{transform:translateY(1px)}
  .promo-msg{text-align:center;min-height:24px;font-size:15px;font-weight:600;margin-bottom:26px}
  .promo-msg.ok{color:var(--green)}
  .promo-msg.err{color:#E1556B}
  .promo-msg.hint{color:var(--muted);font-weight:500}

  /* cards */
  .grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:20px;align-items:stretch;
    margin-top:20px;
  }
  .card{
    position:relative;background:var(--card);border:1.5px solid var(--line);
    border-radius:var(--radius);padding:34px 24px 30px;text-align:center;
    display:flex;flex-direction:column;transition:transform .15s, box-shadow .15s;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(15,14,25,.07)}
  .card.best{
    border-color:var(--purple);border-width:2px;
    background:#FBFAFF;box-shadow:0 14px 40px rgba(119,94,243,.12);
  }
  .badge-best{
    position:absolute;top:-15px;left:50%;transform:translateX(-50%);
    background:var(--purple);color:#fff;font-weight:800;font-size:12px;
    letter-spacing:.12em;padding:8px 18px;border-radius:999px;white-space:nowrap;
  }
  .tag{
    display:inline-block;background:var(--purple-soft);color:var(--purple);
    font-weight:800;font-size:12px;letter-spacing:.09em;
    padding:8px 16px;border-radius:999px;margin-bottom:26px;
  }
  .term{font-weight:800;font-size:30px;letter-spacing:-.01em;margin-bottom:22px}
  .price-old{
    color:var(--muted);font-weight:700;font-size:19px;text-decoration:line-through;
    text-decoration-color:#D9556B;min-height:24px;margin-bottom:2px;
  }
  .price{font-weight:800;font-size:33px;letter-spacing:-.01em;margin-bottom:14px}
  .permonth{color:var(--green);font-weight:800;font-size:26px;letter-spacing:-.01em}
  .permonth-label{color:var(--muted);font-weight:600;font-size:15px;margin-top:2px}
  .schedule{color:#C3BFB6;font-weight:600;font-size:14px;margin-top:14px;
    padding-top:14px;border-top:1px solid var(--line)}
  .once{color:var(--muted);font-weight:600;font-size:15px;margin-top:2px}
  .disc-badge{
    display:inline-block;background:#E9F7EF;color:#2E9E68;font-weight:800;
    font-size:13px;padding:4px 12px;border-radius:999px;margin-bottom:10px;
  }
  .foot{text-align:center;color:var(--muted);font-weight:600;font-size:16px;margin-top:34px}

  @media(max-width:900px){
    .grid{grid-template-columns:repeat(2,1fr);gap:16px}
    body{padding:40px 16px 32px}
  }
  @media(max-width:560px){
    .grid{grid-template-columns:1fr;max-width:380px;margin-inline:auto}
    .card.best{order:-1}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">RELITALK</div>
  <h1>Выберите свой тариф<br><span class="accent">и начните говорить</span></h1>
  <p class="sub">Введите промокод, чтобы увидеть специальные условия</p>

  <div class="promo">
    <div class="promo-field">
      <input id="promo" type="password" placeholder="••••••••" autocomplete="off" spellcheck="false"
             autocapitalize="off" autocorrect="off" aria-label="Промокод" maxlength="24">
      <button type="button" id="toggle" class="eye" aria-label="Показать промокод" title="Показать промокод">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <button id="apply">Применить</button>
  </div>
  <div class="promo-msg hint" id="msg">Скидка по промокоду действует на пакеты 6, 12 и 24 месяца. Тариф «1 месяц» — всегда без скидки.</div>

  <div class="grid" id="grid"></div>

  <p class="foot">Рассрочка без %</p>
</div>

<script>
  // ==== ТАРИФЫ ====
  const PLANS = [
    { tag:'ПОМЕСЯЧНО',            term:'1 месяц',   months:1,  base:74000,  discountable:false, best:false },
    { tag:'РАЗГОВОРНЫЙ УРОВЕНЬ',  term:'6 месяцев', months:6,  base:396000, discountable:true,  best:false },
    { tag:'СВОБОДНЫЙ АНГЛИЙСКИЙ', term:'12 месяцев',months:12, base:480000, discountable:true,  best:true  },
    { tag:'В СОВЕРШЕНСТВЕ',       term:'24 месяца', months:24, base:696000, discountable:true,  best:false },
  ];

  // ==== ПРОМОКОДЫ  (легко поменять на свои) ====
  const CODES = { 'RELI10':10, 'RELI20':20, 'RELI30':30, 'RELI40':40 };

  let discount = 0;
  const fmt = n => Math.round(n).toLocaleString('ru-RU').replace(/,/g,' ');

  function render(){
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for(const p of PLANS){
      const applies = p.discountable && discount>0;
      const total = applies ? p.base*(100-discount)/100 : p.base;
      const perMonth = total / p.months;

      const card = document.createElement('div');
      card.className = 'card' + (p.best ? ' best' : '');

      let inner = '';
      if(p.best) inner += `<div class="badge-best">ЛУЧШИЙ ВЫБОР</div>`;
      inner += `<div class="tag">${p.tag}</div>`;
      inner += `<div class="term">${p.term}</div>`;
      if(applies) inner += `<div class="disc-badge">−${discount}%</div>`;
      inner += `<div class="price-old">${applies ? fmt(p.base)+' ₸' : ''}</div>`;
      inner += `<div class="price">${fmt(total)} ₸</div>`;

      if(p.months === 1){
        inner += `<div class="once">разовый платёж, без рассрочки</div>`;
      } else {
        inner += `<div class="permonth">${fmt(perMonth)} ₸</div>`;
        inner += `<div class="permonth-label">в месяц при рассрочке</div>`;
        inner += `<div class="schedule">0 — 0 — ${p.months}</div>`;
      }
      card.innerHTML = inner;
      grid.appendChild(card);
    }
  }

  // приводим к единому виду: убираем пробелы, верхний регистр,
  // и заменяем похожие кириллические буквы на латинские (частая ошибка раскладки)
  const LOOKALIKE = {'А':'A','В':'B','Е':'E','К':'K','М':'M','Н':'H','О':'O','Р':'P','С':'C','Т':'T','У':'Y','Х':'X'};
  function normalize(v){
    return (v || '')
      .replace(/\s+/g,'')
      .toUpperCase()
      .replace(/[АВЕКМНОРСТУХ]/g, ch => LOOKALIKE[ch]);
  }

  function apply(){
    const raw = normalize(document.getElementById('promo').value);
    const msg = document.getElementById('msg');
    if(raw === ''){
      discount = 0;
      msg.className = 'promo-msg hint';
      msg.textContent = 'Скидка по промокоду действует на пакеты 6, 12 и 24 месяца. Тариф «1 месяц» — всегда без скидки.';
      render(); return;
    }
    if(CODES[raw] !== undefined){
      discount = CODES[raw];
      msg.className = 'promo-msg ok';
      msg.textContent = `Промокод применён: скидка −${discount}% на пакеты. Тариф «1 месяц» идёт без скидки.`;
    } else {
      discount = 0;
      msg.className = 'promo-msg err';
      msg.textContent = 'Промокод не найден. Проверьте написание и попробуйте снова.';
    }
    render();
  }

  const eye = document.getElementById('toggle');
  eye.addEventListener('click', () => {
    const inp = document.getElementById('promo');
    const shown = inp.type === 'text';
    inp.type = shown ? 'password' : 'text';
    eye.classList.toggle('on', !shown);
    eye.setAttribute('aria-label', shown ? 'Показать промокод' : 'Скрыть промокод');
    eye.setAttribute('title', shown ? 'Показать промокод' : 'Скрыть промокод');
    inp.focus();
  });

  document.getElementById('apply').addEventListener('click', apply);
  document.getElementById('promo').addEventListener('keydown', e => { if(e.key==='Enter') apply(); });
  render();
</script>
</body>
</html>
