<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RELITALK — Выберите свой тариф</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF9F6;
    --ink:#0F0E19;
    --purple:#775EF3;
    --purple-dark:#5F46E0;
    --purple-soft:#EDEAFB;
    --green:#5BB482;
    --green-soft:#E9F7EF;
    --green-ink:#2E9E68;
    --muted:#8A8794;
    --line:#E9E6DE;
    --card:#FFFFFF;
    --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Manrope',system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.4;
    padding:56px 24px 44px;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto}
  .eyebrow{text-align:center;color:var(--purple);font-weight:800;
    letter-spacing:.18em;font-size:15px;margin-bottom:26px}
  h1{text-align:center;font-weight:800;font-size:clamp(34px,6vw,64px);
    line-height:1.04;letter-spacing:-.02em;margin-bottom:18px}
  h1 .accent{color:var(--purple)}
  .sub{text-align:center;color:var(--muted);font-size:clamp(15px,2vw,19px);
    font-weight:500;margin-bottom:38px}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;align-items:stretch}
  .card{
    position:relative;background:var(--card);border:1.5px solid var(--line);
    border-radius:var(--radius);padding:34px 22px 26px;text-align:center;
    display:flex;flex-direction:column;transition:transform .15s, box-shadow .15s;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(15,14,25,.07)}
  .card.best{border-color:var(--purple);border-width:2px;background:#FBFAFF;
    box-shadow:0 14px 40px rgba(119,94,243,.12)}
  .badge-best{position:absolute;top:-15px;left:50%;transform:translateX(-50%);
    background:var(--purple);color:#fff;font-weight:800;font-size:12px;
    letter-spacing:.12em;padding:8px 18px;border-radius:999px;white-space:nowrap}
  .tag{display:inline-block;background:var(--purple-soft);color:var(--purple);
    font-weight:800;font-size:12px;letter-spacing:.09em;
    padding:8px 15px;border-radius:999px;margin-bottom:22px}
  .term{font-weight:800;font-size:29px;letter-spacing:-.01em;margin-bottom:16px}

  .base{padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .base-label{color:var(--muted);font-weight:600;font-size:13px;margin-bottom:4px}
  .base-price{font-weight:800;font-size:30px;letter-spacing:-.01em}
  .base-per{color:var(--green);font-weight:700;font-size:17px;margin-top:4px}
  .base-per span{color:var(--muted);font-weight:600;font-size:13px}
  .once{color:var(--muted);font-weight:600;font-size:14px;margin-top:6px}

  .tiers{display:flex;flex-direction:column;gap:12px;margin-top:auto}
  .tier{background:#FBFBF9;border:1px solid var(--line);border-radius:14px;padding:12px 12px 11px}
  .tier.deep{background:var(--green-soft);border-color:#CBEBD9}
  .tier-head{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
  .tier-badge{background:var(--green-soft);color:var(--green-ink);font-weight:800;
    font-size:12px;padding:3px 10px;border-radius:999px}
  .tier.deep .tier-badge{background:#fff;color:var(--green-ink)}
  .tier-price{font-weight:800;font-size:23px;letter-spacing:-.01em}
  .tier-per{color:var(--green-ink);font-weight:700;font-size:15px;margin-top:2px}
  .tier-per span{color:var(--muted);font-weight:600;font-size:12.5px}

  .schedule{color:#C3BFB6;font-weight:600;font-size:13.5px;margin-top:14px}
  .nodisc{color:var(--muted);font-weight:600;font-size:14px;
    background:#FBFBF9;border:1px dashed var(--line);border-radius:14px;
    padding:16px 12px;margin-top:auto}
  .foot{text-align:center;color:var(--muted);font-weight:600;font-size:16px;margin-top:34px}

  @media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr);gap:16px}body{padding:40px 16px 32px}}
  @media(max-width:580px){.grid{grid-template-columns:1fr;max-width:380px;margin-inline:auto}
    .card.best{order:-1}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Выберите свой тариф<br><span class="accent">и начните говорить</span></h1>
  <p class="sub">Скидки 20% и 30% действуют на пакеты 6, 12 и 24 месяца</p>

  <div class="grid" id="grid"></div>
</div>

<script>
  const PLANS = [
    { tag:'ПОМЕСЯЧНО',            term:'1 месяц',    months:1,  base:74000,  discountable:false, best:false },
    { tag:'РАЗГОВОРНЫЙ УРОВЕНЬ',  term:'6 месяцев',  months:6,  base:396000, discountable:true,  best:false },
    { tag:'СВОБОДНЫЙ АНГЛИЙСКИЙ', term:'12 месяцев', months:12, base:480000, discountable:true,  best:true  },
    { tag:'В СОВЕРШЕНСТВЕ',       term:'24 месяца',  months:24, base:696000, discountable:true,  best:false },
  ];
  const DISCOUNTS = [20, 30];

  const fmt = n => Math.round(n).toLocaleString('ru-RU').replace(/,/g,' ');

  const grid = document.getElementById('grid');
  for(const p of PLANS){
    const card = document.createElement('div');
    card.className = 'card' + (p.best ? ' best' : '');
    let h = '';
    if(p.best) h += `<div class="badge-best">ЛУЧШИЙ ВЫБОР</div>`;
    h += `<div class="tag">${p.tag}</div>`;
    h += `<div class="term">${p.term}</div>`;

    h += `<div class="base">`;
    h += `<div class="base-label">${p.discountable ? 'Базовая цена' : 'Фиксированная цена'}</div>`;
    h += `<div class="base-price">${fmt(p.base)} ₸</div>`;
    if(p.months === 1){
      h += `<div class="once">разовый платёж, без рассрочки</div>`;
    } else {
      h += `<div class="base-per">${fmt(p.base/p.months)} ₸ <span>/ мес</span></div>`;
    }
    h += `</div>`;

    if(p.discountable){
      h += `<div class="tiers">`;
      DISCOUNTS.forEach((d, i) => {
        const total = p.base*(100-d)/100;
        h += `<div class="tier${i === DISCOUNTS.length-1 ? ' deep' : ''}">
                <div class="tier-head"><span class="tier-badge">−${d}%</span></div>
                <div class="tier-price">${fmt(total)} ₸</div>
                <div class="tier-per">${fmt(total/p.months)} ₸ <span>/ мес</span></div>
              </div>`;
      });
      h += `</div>`;
      h += `<div class="schedule">рассрочка 0 — 0 — ${p.months}</div>`;
    } else {
      h += `<div class="nodisc">Скидки на помесячный тариф<br>не распространяются</div>`;
    }
    card.innerHTML = h;
    grid.appendChild(card);
  }
</script>
</body>
</html>
